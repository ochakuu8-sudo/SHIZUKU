name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5"
  GODOT_STATUS: stable
  GODOT_RELEASE: "4.5-stable"
  GODOT_TEMPLATES_DIR: /home/runner/.local/share/godot/export_templates/4.5.stable
  BUILD_DIR: /tmp/shizuku-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Cache Godot engine and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot
            ${{ env.GODOT_TEMPLATES_DIR }}
          key: godot-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot

      - name: Install export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "${GODOT_TEMPLATES_DIR}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "${GODOT_TEMPLATES_DIR}/"

      - name: Make Godot binary executable
        run: chmod +x /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64

      - name: Import project
        run: /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --import --quit

      - name: Run automated tests
        run: /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --script res://tests/test_runner.gd

      - name: Build Windows PC
        run: |
          mkdir -p "${BUILD_DIR}/windows"
          /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --export-release "Windows Desktop" "${BUILD_DIR}/windows/SHIZUKU.exe"
          cd "${BUILD_DIR}/windows"
          zip -r "${BUILD_DIR}/SHIZUKU-windows.zip" .

      - name: Build Web
        run: |
          mkdir -p "${BUILD_DIR}/web"
          /tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 --headless --export-release "Web" "${BUILD_DIR}/web/index.html"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SHIZUKU-windows
          path: /tmp/shizuku-build/SHIZUKU-windows.zip

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: SHIZUKU-web
          path: /tmp/shizuku-build/web

      - name: Publish Web build to gh-pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${BUILD_DIR}/web"
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy web build ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
